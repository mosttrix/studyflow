
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="txtlogo">StudyFlow</h1>

        <div class="upbuttons" id="upbuttons">
            <a href="register.html">
                <button class="nav-btn">Register</button>
            </a>

            <a href="login.html">
                <button class="nav-btn">Login</button>
            </a>
        </div>
    </header>

    <main>
        <!-- Pagina pentru utilizatorii nelogați -->
        <section id="welcome">
            <h1 id="infotxt">
                Învață mai inteligent. Organizează-te mai bine.
                Evoluează în fiecare zi.
            </h1>

            <button id="getstarted">Get Started</button>
        </section>

        <!-- Chatul apare numai când utilizatorul este logat -->
        <section id="chat" hidden>
            <div class="chat-header">
                <h2>StudyFlow AI</h2>
                <p>Asistentul tău personal pentru învățare</p>
            </div>

            <div id="messages" aria-live="polite">
                <div class="message ai-message">
                    Salut! 👋 Cu ce te pot ajuta astăzi?
                </div>
            </div>

            <form id="chat-form">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Scrie un mesaj..."
                    autocomplete="off"
                    aria-label="Mesajul tău"
                    required
                >

                <button type="submit" id="send-btn">
                    Trimite
                </button>
            </form>
        </section>
    </main>

    <footer>
        <h1 id="ctctxt">CONTACT</h1>

        <div class="contact">
            <p>Număr de telefon: 0763034832</p>
            <p>Email: studyflow@gmail.com</p>
        </div>

        <p id="cpy">
            © 2026 StudyFlow. Toate drepturile rezervate.
        </p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentUser = JSON.parse(
                sessionStorage.getItem("currentUser")
            );

            const upbuttons = document.getElementById("upbuttons");
            const welcome = document.getElementById("welcome");
            const chat = document.getElementById("chat");

            // Dacă utilizatorul este logat, afișăm chatul
            if (currentUser) {
                welcome.hidden = true;
                chat.hidden = false;

                const greeting = document.createElement("span");
                greeting.className = "user-greeting";
                greeting.textContent =
                    "Salut, " + currentUser.username + "!";

                const logoutBtn = document.createElement("button");
                logoutBtn.id = "logoutBtn";
                logoutBtn.className = "nav-btn";
                logoutBtn.textContent = "Logout";

                upbuttons.replaceChildren(greeting, logoutBtn);

                logoutBtn.addEventListener("click", function () {
                    sessionStorage.removeItem("currentUser");
                    window.location.reload();
                });

            } else {
                welcome.hidden = false;
                chat.hidden = true;
            }

            // Butonul Get Started duce utilizatorul la înregistrare
            document.getElementById("getstarted")
                .addEventListener("click", function () {
                    window.location.href = "register.html";
                });

            // Trimiterea mesajelor în chat
            const chatForm = document.getElementById("chat-form");
            const messageInput = document.getElementById("message-input");
            const messages = document.getElementById("messages");

            function addMessage(text, className) {
                const message = document.createElement("div");
                message.className = "message " + className;
                message.textContent = text;

                messages.appendChild(message);
                messages.scrollTop = messages.scrollHeight;
            }

            chatForm.addEventListener("submit", function (event) {
                event.preventDefault();

                const text = messageInput.value.trim();

                if (!text) return;

                addMessage(text, "user-message");
                messageInput.value = "";
                messageInput.focus();

                // Răspuns temporar, până conectăm API-ul AI
                addMessage(
                    "Mesajul tău a fost primit! În curând voi putea răspunde folosind AI.",
                    "ai-message"
                );
            });
        });
    </script>

</body>
</html>

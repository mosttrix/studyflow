<!DOCTYPE html> 
<html>
<head>
    <title>Login StudyFlow</title>
    <link rel="stylesheet" href="style3.css">
</head>
<header>
    <h1>Login</h1>
    <a href="index.html">
        <button id="btm">Back To Main</button>
    </a>
</header>
<br><br><br><br><br><br>
<body>
    <div class="formular">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <label for="password">Parolă</label>
        <input type="password" id="password" name="password">

        <button type="button" id="loginbtn" style="background-color: #344E41; color: white; font-size: 30px; padding: 10px 18px; border-radius: 8px; cursor: pointer;">Login</button>
    </div>

    <script>
        document.getElementById('loginbtn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert('Te rugăm să introduci email-ul și parola!');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const matchedUser = users.find(u => u.email === email && u.password === password);

            if (matchedUser) {
                sessionStorage.setItem('currentUser', JSON.stringify(matchedUser));
                alert('Autentificare reușită! Bine ai venit, ' + matchedUser.username + '!');
                window.location.href = 'index.html';
            } else {
                alert('Email sau parolă incorectă!');
            }
        });
    </script>
</body>
<br><br><br><br><br><br>

</footer>
</html>

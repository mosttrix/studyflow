
<!DOCTYPE html>
<html>
<head>
    <title>StudyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="txtlogo">StudyFlow</h1>

        <div class="upbuttons">
            <a href="register.html">
                <button class="nav-btn">Register</button>
            </a>

            <a href="login.html">
                <button class="nav-btn">Login</button>
            </a>
        </div>
    </header>

    <main>
        <div id="welcome">
            <h1 id="infotxt">
                Învață mai inteligent. Organizează-te mai bine.
                Evoluează în fiecare zi.
            </h1>

            <button id="getstarted">Get Started</button>
        </div>

        <div id="chat" hidden>
            <div class="chatheader">
                <h2>StudyFlow AI</h2>
                <p>Cu ce te pot ajuta astăzi?</p>
            </div>

            <div id="messages">
                <div class="message ai">
                    Salut! Cu ce te pot ajuta astăzi?
                </div>
            </div>

            <form id="chatform">
                <input type="text" id="message" placeholder="Scrie un mesaj..." required>
                <button type="submit" id="sendbtn">Trimite</button>
            </form>
        </div>
    </main>

    <footer>
        <h1 id="ctctxt">CONTACT</h1>
        <div class="contact">
            <p>Numar de Telefon : 0763034832</p>
            <p>Email : studyflow@gmail.com</p>
        </div>
        <p id="cpy">© 2026 StudyFlow. Toate drepturile rezervate.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const currentUser = JSON.parse(sessionStorage.getItem("currentUser"));
            const upbuttons = document.querySelector(".upbuttons");
            const welcome = document.getElementById("welcome");
            const chat = document.getElementById("chat");

            if (currentUser) {
                welcome.hidden = true;
                chat.hidden = false;

                upbuttons.innerHTML = `
                    <span class="salut">Salut, ${currentUser.username}!</span>
                    <button id="logoutBtn" class="nav-btn">Logout</button>
                `;

                document.getElementById("logoutBtn").addEventListener("click", function() {
                    sessionStorage.removeItem("currentUser");
                    window.location.reload();
                });
            }

            document.getElementById("getstarted").addEventListener("click", function() {
                window.location.href = "register.html";
            });

            const chatform = document.getElementById("chatform");
            const message = document.getElementById("message");
            const messages = document.getElementById("messages");

            chatform.addEventListener("submit", function(event) {
                event.preventDefault();

                const text = message.value.trim();

                if (text === "") {
                    return;
                }

                const userMessage = document.createElement("div");
                userMessage.className = "message user";
                userMessage.textContent = text;
                messages.appendChild(userMessage);

                message.value = "";

                const aiMessage = document.createElement("div");
                aiMessage.className = "message ai";
                aiMessage.textContent = "Am primit mesajul tău! Aici voi răspunde cu ajutorul AI.";
                messages.appendChild(aiMessage);

                messages.scrollTop = messages.scrollHeight;
            });
        });
    </script>

</body>
</html>
